name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc 15
            cc: gcc-15
            cxx: g++-15
          - name: clang 22
            cc: clang-22
            cxx: clang++-22
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-26.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 23
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y clang-format-23
      - name: Check formatting
        run: clang-format-23 --dry-run --Werror main.cpp Collatz.cpp Collatz.h tests/collatz_tests.cpp

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy 23
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y clang-tidy-23
      - name: Configure (compile database)
        run: cmake --preset debug -DBUILD_TESTING=OFF
      - name: Run clang-tidy
        run: clang-tidy-23 -p build/debug --warnings-as-errors='*' Collatz.cpp main.cpp
